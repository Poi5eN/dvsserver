name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Obfuscate code
        run: node obfuscate.js

      - name: Verify obfuscated files
        run: |
          echo "Checking if dist directory exists..."
          ls -la dist/
          echo "Checking if key files exist..."
          ls -la dist/server.js dist/app.js

      - name: Create .env file
        run: |
          echo "PORT=4000" > .env
          echo "NODE_ENV=production" >> .env
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
          echo "CLOUDINARY_CLIENT_NAME=${{ secrets.CLOUDINARY_CLIENT_NAME }}" >> .env
          echo "CLOUDINARY_CLIENT_API=${{ secrets.CLOUDINARY_CLIENT_API }}" >> .env
          echo "CLOUDINARY_CLIENT_SECRET=${{ secrets.CLOUDINARY_CLIENT_SECRET }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "SMTP_MAIL=${{ secrets.SMTP_MAIL }}" >> .env
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env
          echo "MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }}" >> .env
          echo "MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}" >> .env
          echo "MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}" >> .env
          echo "MINIO_BUCKET=${{ secrets.MINIO_BUCKET }}" >> .env
          echo "ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}" >> .env
          echo "ENCRYPTION_IV=${{ secrets.ENCRYPTION_IV }}" >> .env

      - name: Create backend directory on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            mkdir -p /root/backend

      - name: Transfer files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "dist,package.json,Dockerfile,.env,entrypoint.sh"
          target: "/root/backend"

      - name: Deploy on VPS and clean up
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /root/backend
            echo "Current directory contents:"
            ls -la
            echo "Building Docker image..."
            docker build -t digiserver:latest . || { echo "Docker build failed"; exit 1; }
            echo "Stopping existing container..."
            docker stop digiserver || true
            echo "Removing existing container..."
            docker rm digiserver || true
            echo "Starting new container..."
            docker run -d -p 4000:4000 --name digiserver digiserver:latest || { echo "Container start failed"; exit 1; }
            echo "Checking container status..."
            docker ps | grep digiserver
            echo "Checking container logs..."
            sleep 5
            docker logs digiserver --tail 20
            echo "Cleaning up old images..."
            docker image prune -a -f
            docker container prune -f
            echo "Deployment completed successfully!"